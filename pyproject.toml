[project]
name = "voztrad"
version = "0.1.0"
description = "Traductor de voz bidireccional local para llamadas (motor headless)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ctranslate2==4.8.2",
    "faster-whisper==1.2.1",
    "onnxruntime-gpu==1.29.0; sys_platform != 'darwin'",  # CUDA 12 build
    "onnxruntime>=1.22,<2; sys_platform == 'darwin'",
    "numpy",
    "soxr",
    "soundfile",
    "PyAudioWPatch==0.2.12.8; sys_platform == 'win32'",
    "piper-tts==1.8.0",
    "sentencepiece",
    "huggingface_hub",
    "onnx-asr[gpu,hub]==0.12.0; sys_platform != 'darwin'",
    "onnx-asr[hub]==0.12.0; sys_platform == 'darwin'",
    "sounddevice>=0.5; sys_platform == 'darwin'",
    "pynput>=1.8; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "psutil",
    "comtypes>=1.4; sys_platform == 'win32'",
    "pycaw>=20240210; sys_platform == 'win32'",
    "evdev; sys_platform == 'linux'",
    # CUDA 12 runtime libs that ctranslate2 + onnxruntime-gpu dlopen at session
    # creation. On Windows these come from the ~/tools redist (see cuda_dlls.py).
    "nvidia-cublas-cu12; sys_platform == 'linux'",
    "nvidia-cudnn-cu12; sys_platform == 'linux'",
    "nvidia-cuda-runtime-cu12; sys_platform == 'linux'",
    "nvidia-cuda-nvrtc-cu12; sys_platform == 'linux'",
    "nvidia-curand-cu12; sys_platform == 'linux'",
    "nvidia-cufft-cu12; sys_platform == 'linux'",
]

[project.optional-dependencies]
ui = [
    "pyside6>=6.8",
]

[tool.uv]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'", "sys_platform == 'darwin' and platform_machine == 'arm64'"]
# Piper needs CPU ORT on macOS; elsewhere its files would overwrite the CUDA build.
# Keep both Mac architectures resolvable (new ORT wheels may drop Intel). No PyTorch.
override-dependencies = ["onnxruntime ; sys_platform == 'darwin'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voztrad"]

# Builds de onnxruntime-gpu para CUDA 12 + cuDNN 9 (mismo stack que CTranslate2).
[[tool.uv.index]]
name = "ort-cuda12"
url = "https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/onnxruntime-cuda-12/pypi/simple/"
explicit = true

[tool.uv.sources]
onnxruntime-gpu = { index = "ort-cuda12" }
